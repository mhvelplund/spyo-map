[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "spyo-map"
version = "0.0.0"
description = "EXIF extraction tooling for the Spyo Map image browser"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "Pillow>=10.0.0",
]

[project.scripts]
extract-exif = "extract_exif:main"

[tool.hatch.build.targets.wheel]
include = ["extract_exif.py"]

[tool.hatch.build.targets.sdist]
include = ["extract_exif.py", "README.md", "pyproject.toml"]
