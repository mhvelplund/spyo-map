services:
  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 minioadmin minioadmin &&
        mc mb --ignore-existing local/spyro-map &&
        mc anonymous set download local/spyro-map/images &&
        echo 'MinIO bucket ready'
      "

  backend:
    build:
      context: .
      dockerfile: packages/backend/Dockerfile
    ports:
      - "3001:3001"
    environment:
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: spyro-map
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_REGION: us-east-1
      IMAGES_BASE_URL: http://localhost:9000/spyro-map
      DB_REFRESH_INTERVAL_MS: "30000"
      PORT: "3001"
    depends_on:
      minio-init:
        condition: service_completed_successfully
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: packages/frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

  extractor:
    build:
      context: .
      dockerfile: packages/extractor/Dockerfile
    environment:
      STORAGE_ENDPOINT: http://minio:9000
      STORAGE_BUCKET: spyro-map
      STORAGE_ACCESS_KEY: minioadmin
      STORAGE_SECRET_KEY: minioadmin
      STORAGE_REGION: us-east-1
    depends_on:
      minio-init:
        condition: service_completed_successfully
    profiles:
      - ingest

volumes:
  minio-data:
