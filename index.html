<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- Primary Meta Tags -->
    <title>Spyo Map - Geo-Tagged Image Browser</title>
    <meta name="title" content="Spyo Map - Geo-Tagged Image Browser" />
    <meta name="description" content="Interactive map browser for exploring geo-tagged images. Browse photos by location, view in lightbox, and share on social media." />
    <meta name="keywords" content="geo-tagged images, photo map, image browser, GPS photos, interactive map" />
    <meta name="author" content="Spyo Map" />
    
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="/" />
    <meta property="og:title" content="Spyo Map - Geo-Tagged Image Browser" />
    <meta property="og:description" content="Interactive map browser for exploring geo-tagged images. Browse photos by location, view in lightbox, and share on social media." />
    <meta property="og:image" content="/vite.svg" />
    
    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="/" />
    <meta property="twitter:title" content="Spyo Map - Geo-Tagged Image Browser" />
    <meta property="twitter:description" content="Interactive map browser for exploring geo-tagged images. Browse photos by location, view in lightbox, and share on social media." />
    <meta property="twitter:image" content="/vite.svg" />
    
    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#ffffff" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Spyo Map" />
    
    <!-- Preconnect to external domains for performance -->
    <link rel="preconnect" href="https://maps.googleapis.com" />
    <link rel="preconnect" href="https://maps.gstatic.com" />
    
    <!-- DNS prefetch for better performance -->
    <link rel="dns-prefetch" href="//maps.googleapis.com" />
    <link rel="dns-prefetch" href="//maps.gstatic.com" />
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
