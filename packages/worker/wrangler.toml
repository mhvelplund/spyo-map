name = "spyo-map"
main = "src/index.ts"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

routes = [{ pattern = "spyo-map.isntall.net", custom_domain = true }]

[vars]
IMAGES_BASE_URL = "https://spyo-img.isntall.net"

[assets]
directory = "../frontend/dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Without this, the asset router answers /api/* and /auth/* with index.html
# (SPA fallback) before the Worker ever runs.
run_worker_first = ["/api/*", "/auth/*"]

# Secrets (not vars): SESSION_SECRET, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET.
# Set with `wrangler secret put <NAME>`; for `wrangler dev` put them in .dev.vars.

[[d1_databases]]
binding = "DB"
database_name = "spyo-map"
database_id = "d2237940-aa4a-4574-a1b8-6a084270cc8e"
migrations_dir = "migrations"

# Private bucket for raw/ uploads (also failed/ and originals/). It must never get a custom domain or r2.dev: these
# objects keep their full EXIF.
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "spyo-map-private"

# Public bucket with processed images. The Worker copies objects inside it (images/ <-> private/) to hide and unhide
# photos; it still never proxies image bytes to clients.
[[r2_buckets]]
binding = "PUBLIC_BUCKET"
bucket_name = "spyo-map"
