<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" href="/icons/favicon-32.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Spyo Map - Geo-Tagged Image Browser</title>
    <meta name="title" content="Spyo Map - Geo-Tagged Image Browser" />
    <meta name="description" content="Interactive map browser for exploring geo-tagged images. Browse photos by location, view in lightbox, and share on social media." />
    <meta name="keywords" content="geo-tagged images, photo map, image browser, GPS photos, interactive map" />
    <meta name="author" content="Spyo Map" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Spyo Map" />
    <meta property="og:url" content="https://spyo-map.isntall.net/" />
    <meta property="og:title" content="Spyo Map - Geo-Tagged Image Browser" />
    <meta property="og:description" content="Interactive map browser for exploring geo-tagged images. Browse photos by location, view in lightbox, and share on social media." />
    <meta property="og:image" content="https://spyo-map.isntall.net/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Spyo Map" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:url" content="https://spyo-map.isntall.net/" />
    <meta name="twitter:title" content="Spyo Map - Geo-Tagged Image Browser" />
    <meta name="twitter:description" content="Interactive map browser for exploring geo-tagged images. Browse photos by location, view in lightbox, and share on social media." />
    <meta name="twitter:image" content="https://spyo-map.isntall.net/og-image.png" />

    <!-- PWA Meta Tags -->
    <meta name="theme-color" content="#4285f4" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Spyo Map" />

    <!-- Preconnect to OpenStreetMap for performance -->
    <link rel="preconnect" href="https://tile.openstreetmap.org" />

    <!-- DNS prefetch for better performance -->
    <link rel="dns-prefetch" href="//tile.openstreetmap.org" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
